<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunrise Property — Get in Touch</title>
<meta name="description" content="Contact Sunrise Property for inquiries about our managed properties.">

<!-- ============================================================ -->
<!-- EDIT THESE 4 LINES WITH YOUR REAL DETAILS, THEN SAVE         -->
<!-- ============================================================ -->
<script>
  const CONFIG = {
    email:      "info@sunriseproperty.co.nz",
    phone:      "+64273880809",        // for "Call us" button — international format, no spaces
    whatsapp:   "64273880809",         // for WhatsApp — same number, no + and no spaces
    businessName: "Sunrise Property"
  };
</script>
<!-- ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, sans-serif;
    background: #FAF7F2;
    color: #1F1B16;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    background:
      radial-gradient(circle at 20% 0%, #FFF4E0 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, #FFE8D6 0%, transparent 50%),
      #FAF7F2;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 36px 28px 28px;
    box-shadow: 0 1px 2px rgba(31, 27, 22, 0.04), 0 8px 32px rgba(31, 27, 22, 0.06);
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon-wrap {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, #FFB570 0%, #FF8A3D 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(255, 138, 61, 0.25);
  }
  .icon-wrap svg { width: 30px; height: 30px; stroke: #FFFFFF; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #6B6157;
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .buttons { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border: 1px solid #EDE5D9;
    border-radius: 14px;
    background: #FFFFFF;
    color: #1F1B16;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-appearance: none;
  }
  .btn:hover, .btn:active { background: #FAF7F2; border-color: #DDD2C2; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-icon svg { width: 18px; height: 18px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .btn-email .btn-icon  { background: #FFF1E0; }
  .btn-email .btn-icon svg { stroke: #C45A0F; }

  .btn-whatsapp .btn-icon { background: #E0F5E5; }
  .btn-whatsapp .btn-icon svg { fill: #128C42; stroke: none; }

  .btn-call .btn-icon { background: #E5EFFB; }
  .btn-call .btn-icon svg { stroke: #1F4FA8; }

  .btn-label { flex: 1; text-align: left; }
  .btn-meta  { font-size: 12px; color: #8B8074; font-weight: 400; }

  .arrow svg { width: 16px; height: 16px; stroke: #B5A99A; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid #F2EBDF;
    text-align: center;
    font-size: 12px;
    color: #8B8074;
    line-height: 1.6;
  }
  .footer strong { color: #6B6157; font-weight: 500; }
</style>
</head>
<body>

<main class="card">
  <div class="icon-wrap">
    <!-- house icon -->
    <svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg>
  </div>

  <h1 id="heading">Sunrise Property</h1>
  <p class="subtitle">How would you like to get in touch?</p>

  <div class="buttons">
    <a class="btn btn-email" id="link-email">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </span>
      <span class="btn-label">
        Email us
        <div class="btn-meta" id="meta-email"></div>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="btn btn-whatsapp" id="link-whatsapp">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24"><path d="M17.6 6.3A7.85 7.85 0 0 0 12 4a7.94 7.94 0 0 0-6.77 12.04L4 20l4.07-1.21A7.94 7.94 0 0 0 12 19.93h.01A7.94 7.94 0 0 0 17.6 6.3zM12 18.6h-.01a6.6 6.6 0 0 1-3.36-.92l-.24-.14-2.42.72.72-2.36-.16-.25a6.6 6.6 0 1 1 12.23-3.5A6.6 6.6 0 0 1 12 18.6zm3.62-4.94c-.2-.1-1.17-.58-1.36-.64-.18-.07-.31-.1-.45.1-.13.2-.51.64-.62.77-.12.13-.23.15-.42.05-.2-.1-.84-.31-1.6-.99-.6-.52-.99-1.17-1.1-1.37-.12-.2-.01-.31.09-.41.09-.09.2-.23.3-.35.1-.12.13-.2.2-.33.07-.13.03-.25-.02-.35-.05-.1-.45-1.08-.62-1.48-.16-.39-.32-.34-.45-.34-.12 0-.25-.02-.38-.02s-.35.05-.53.25-.7.69-.7 1.68.72 1.94.82 2.08c.1.13 1.41 2.16 3.42 3.03.48.21.85.33 1.14.42.48.15.91.13 1.26.08.38-.06 1.17-.48 1.34-.94.16-.46.16-.86.12-.94-.05-.09-.18-.13-.38-.23z"/></svg>
      </span>
      <span class="btn-label">
        WhatsApp message
        <div class="btn-meta">Quick reply, usually within an hour</div>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <a class="btn btn-call" id="link-call">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </span>
      <span class="btn-label">
        Call us
        <div class="btn-meta" id="meta-phone"></div>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>
  </div>

  <div class="footer">
    <strong id="footer-name">Sunrise Property</strong><br>
    Auckland, New Zealand
  </div>
</main>

<script>
  // Wire up the buttons from CONFIG
  document.getElementById('heading').textContent = CONFIG.businessName;
  document.getElementById('footer-name').textContent = CONFIG.businessName;

  const subject = encodeURIComponent('Property inquiry');
  const body    = encodeURIComponent('Hi,\n\nI saw your sign and would like to know more about the property.\n\nMy name: \nBest time to contact: \n\nThanks!');
  document.getElementById('link-email').href = `mailto:${CONFIG.email}?subject=${subject}&body=${body}`;
  document.getElementById('meta-email').textContent = CONFIG.email;

  const waText = encodeURIComponent("Hi, I'd like to inquire about a property I saw advertised. ");
  document.getElementById('link-whatsapp').href = `https://wa.me/${CONFIG.whatsapp}?text=${waText}`;

  document.getElementById('link-call').href = `tel:${CONFIG.phone}`;
  // Format phone for display: +64211234567 -> +64 21 123 4567
  const p = CONFIG.phone.replace('+64', '+64 ').replace(/(\+64 \d{2,3})(\d{3})(\d{4})/, '$1 $2 $3');
  document.getElementById('meta-phone').textContent = p;
</script>

</body>
</html>
